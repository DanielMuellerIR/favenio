name: Publish Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.14.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # Derselbe öffentliche Schlüssel, den build-app.sh als SUPublicEDKey in
      # beide Bundles schreibt — die Quelle ist build-app.sh, hier steht nur
      # die Kopie, gegen die das Release-Artefakt geprüft wird. Ein Test
      # (tests/test_appcast_workflow.py) hält beide Stellen zusammen.
      SPARKLE_PUBLIC_KEY: "H504COadHZVAKo+/XD0jzXT5PJzghkS2t/DDYmuHPDg="

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download release DMG and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "ERROR: release $RELEASE_TAG must contain exactly one DMG." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" --json body --jq .body \
            > "${dmgs[0]%.dmg}.md"

      - name: Generate signed appcast
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "ERROR: GitHub secret SPARKLE_PRIVATE_KEY is missing." >&2
            exit 1
          fi

          swift package resolve
          tool="$(find .build/artifacts/sparkle -type f \
            -name sign_update -not -path '*/old_dsa_scripts/*' -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "ERROR: Sparkle sign_update tool was not found." >&2
            exit 1
          fi

          shopt -s nullglob
          dmgs=(update/*.dmg)
          dmg="${dmgs[0]}"
          notes="${dmg%.dmg}.md"
          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly \
            -mountpoint "$mountpoint" -quiet

          # ===== BEGIN favenio-check-artifact =====
          # Hartes Tor VOR jeder Signatur: Was in den Feed kommt, installieren
          # die Apps nach einem Klick. Geprüft wurden früher nur "genau zwei
          # .app und gleiche Versionsstrings" — ein versehentlich oder fremd
          # hochgeladenes DMG wäre damit zur kryptografisch beglaubigten
          # Aktualisierung geworden. Jetzt zählen Notarisierung (angeheftetes
          # Ticket), Gatekeeper-Urteil, Produktidentität (Bundle-IDs und der
          # Update-Schlüssel SUPublicEDKey) und die Zuordnung zum Release-Tag.
          # Fail-closed: Jeder Fehlschlag beendet den Lauf, bevor sign_update
          # überhaupt läuft.
          #
          # Argumente: <dmg> <mountpoint> <release-tag> <erwarteter Schlüssel>
          # Setzt bei Erfolg ARTIFACT_VERSION, ARTIFACT_BUILD und
          # ARTIFACT_PUBLIC_KEY.
          favenio_check_artifact() {
            local dmg="$1" mountpoint="$2" tag="$3" expected_key="$4"
            local app plist bundle_id app_version app_build app_key
            local main_apps=0 quick_apps=0
            shopt -s nullglob

            # stapler validate beweist das ANGEHEFTETE Ticket (gilt auch ohne
            # Netz); spctl fragt zusätzlich das Gatekeeper-Urteil ab.
            if ! xcrun stapler validate "$dmg" >/dev/null 2>&1; then
              echo "ERROR: $dmg carries no stapled notarization ticket." >&2
              return 1
            fi
            if ! spctl --assess --type open \
                --context context:primary-signature "$dmg" >/dev/null 2>&1
            then
              echo "ERROR: Gatekeeper rejects $dmg." >&2
              return 1
            fi

            local apps=("$mountpoint"/*.app)
            if (( ${#apps[@]} != 2 )); then
              echo "ERROR: release DMG must contain exactly two apps." >&2
              return 1
            fi

            ARTIFACT_VERSION=""
            ARTIFACT_BUILD=""
            ARTIFACT_PUBLIC_KEY=""
            for app in "${apps[@]}"; do
              plist="$app/Contents/Info.plist"
              if ! codesign --verify --strict "$app" >/dev/null 2>&1; then
                echo "ERROR: invalid code signature: ${app##*/}" >&2
                return 1
              fi
              if ! spctl --assess --type execute "$app" >/dev/null 2>&1; then
                echo "ERROR: Gatekeeper rejects ${app##*/}." >&2
                return 1
              fi
              # release.sh staplet beide Bundles einzeln. Ohne eigenes Ticket
              # bräuchte eine aus dem DMG gezogene App beim Start Netz.
              if ! xcrun stapler validate "$app" >/dev/null 2>&1; then
                echo "ERROR: ${app##*/} carries no stapled ticket." >&2
                return 1
              fi

              # Gültig signiert heißt nur "notarisiert", nicht "unser
              # Produkt": Bundle-ID und Update-Schlüssel müssen stimmen.
              bundle_id=$(/usr/libexec/PlistBuddy -c \
                'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true)
              case "$bundle_id" in
                local.favenio) main_apps=$((main_apps + 1)) ;;
                local.favenio.quick) quick_apps=$((quick_apps + 1)) ;;
                *)
                  echo "ERROR: unexpected bundle identifier" \
                    "'${bundle_id:-none}' in ${app##*/}." >&2
                  return 1
                  ;;
              esac

              app_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' \
                "$plist" 2>/dev/null || true)
              if [[ "$app_key" != "$expected_key" ]]; then
                echo "ERROR: ${app##*/} trusts update key" \
                  "'${app_key:-none}' instead of '$expected_key'." >&2
                return 1
              fi
              ARTIFACT_PUBLIC_KEY="$app_key"

              app_version=$(/usr/libexec/PlistBuddy -c \
                'Print :CFBundleShortVersionString' "$plist" \
                2>/dev/null || true)
              app_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
                "$plist" 2>/dev/null || true)
              if [[ -z "$app_version" || -z "$app_build" ]]; then
                echo "ERROR: ${app##*/} carries no version." >&2
                return 1
              fi
              if [[ -z "$ARTIFACT_VERSION" ]]; then
                ARTIFACT_VERSION="$app_version"
                ARTIFACT_BUILD="$app_build"
              elif [[ "$ARTIFACT_VERSION" != "$app_version" ]] ||
                   [[ "$ARTIFACT_BUILD" != "$app_build" ]]; then
                echo "ERROR: app versions in the release DMG differ." >&2
                return 1
              fi
            done

            if (( main_apps != 1 || quick_apps != 1 )); then
              echo "ERROR: release DMG needs Favenio and FavenioQuick once" \
                "each." >&2
              return 1
            fi

            # Der Feed-Eintrag verlinkt das DMG unter dem Tag. Passt die
            # Version im Bundle nicht zum Tag, hängt das falsche Artefakt am
            # Release.
            if [[ "${tag#v}" != "$ARTIFACT_VERSION" ]]; then
              echo "ERROR: release tag $tag does not match app version" \
                "$ARTIFACT_VERSION." >&2
              return 1
            fi

            echo "Release artifact verified: $ARTIFACT_VERSION" \
              "(build $ARTIFACT_BUILD), notarized, stapled, tag matched."
          }
          # ===== END favenio-check-artifact =====

          favenio_check_artifact "$dmg" "$mountpoint" "$RELEASE_TAG" \
            "$SPARKLE_PUBLIC_KEY"
          version="$ARTIFACT_VERSION"
          build="$ARTIFACT_BUILD"

          # sign_update accepts the private key on stdin, so it appears in
          # neither argv, a file nor the log.
          signature_attributes=$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              "$tool" --ed-key-file - "$dmg"
          )
          published_at=$(
            gh release view "$RELEASE_TAG" --json publishedAt \
              --jq .publishedAt
          )
          release_url=$(
            gh release view "$RELEASE_TAG" --json url --jq .url
          )
          notes_html="${notes%.md}.html"
          jq -n --rawfile text "$notes" \
            --arg context "$GITHUB_REPOSITORY" \
            '{text: $text, mode: "gfm", context: $context}' |
            gh api --method POST markdown --input - \
              -H 'Accept: text/html' > "$notes_html"

          export APPCAST_BUILD="$build"
          export APPCAST_DMG="$dmg"
          export APPCAST_NOTES_HTML="$notes_html"
          export APPCAST_PUBLISHED_AT="$published_at"
          export APPCAST_RELEASE_URL="$release_url"
          export APPCAST_SIGNATURE_ATTRIBUTES="$signature_attributes"
          export APPCAST_VERSION="$version"

          python3 <<'PY'
          import email.utils
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime

          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ET.register_namespace("sparkle", sparkle)

          attributes = os.environ["APPCAST_SIGNATURE_ATTRIBUTES"]
          match = re.fullmatch(
              r'sparkle:edSignature="([^"]+)" length="([0-9]+)"',
              attributes,
          )
          if match is None:
              raise SystemExit("ERROR: unexpected sign_update output")
          signature, length = match.groups()

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          dmg_name = pathlib.Path(os.environ["APPCAST_DMG"]).name
          version = os.environ["APPCAST_VERSION"]
          build = os.environ["APPCAST_BUILD"]
          published = datetime.fromisoformat(
              os.environ["APPCAST_PUBLISHED_AT"].replace("Z", "+00:00")
          )

          rss = ET.Element("rss", {"version": "2.0"})
          channel = ET.SubElement(rss, "channel")
          ET.SubElement(channel, "title").text = "Favenio Updates"
          ET.SubElement(channel, "link").text = (
              f"https://github.com/{repository}"
          )
          ET.SubElement(channel, "description").text = (
              "Signed updates for Favenio and FavenioQuick"
          )
          ET.SubElement(channel, "language").text = "en"

          item = ET.SubElement(channel, "item")
          ET.SubElement(item, "title").text = f"Version {version}"
          ET.SubElement(item, "link").text = os.environ[
              "APPCAST_RELEASE_URL"
          ]
          ET.SubElement(item, f"{{{sparkle}}}version").text = build
          ET.SubElement(
              item, f"{{{sparkle}}}shortVersionString"
          ).text = version
          ET.SubElement(
              item, f"{{{sparkle}}}minimumSystemVersion"
          ).text = "12.0"
          ET.SubElement(item, "pubDate").text = email.utils.format_datetime(
              published
          )
          ET.SubElement(item, "description").text = pathlib.Path(
              os.environ["APPCAST_NOTES_HTML"]
          ).read_text(encoding="utf-8")
          ET.SubElement(
              item,
              "enclosure",
              {
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"{tag}/{dmg_name}"
                  ),
                  f"{{{sparkle}}}edSignature": signature,
                  "length": length,
                  "type": "application/x-apple-diskimage",
              },
          )

          tree = ET.ElementTree(rss)
          ET.indent(tree, space="  ")
          tree.write(
              "site/appcast.xml",
              encoding="utf-8",
              xml_declaration=True,
          )
          PY

          xmllint --noout site/appcast.xml

          # Die Apps verlangen einen signierten Feed (SURequireSignedFeed):
          # Sparkle prüft die appcast.xml selbst gegen den SUPublicEDKey,
          # nicht nur das DMG. sign_update bettet die Signatur als
          # sparkle-signatures-Block am Dateiende ein; ohne diesen Block
          # meldet die App „The update feed is improperly signed".
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$tool" --ed-key-file - --disable-signing-warning \
              site/appcast.xml

          # ===== BEGIN favenio-check-feed =====
          # Selbsttest gegen den öffentlichen Schlüssel AUS DEN BUNDLES.
          # Früher verifizierte der Selbsttest mit demselben privaten
          # Schlüssel, mit dem gerade signiert wurde — er konnte deshalb
          # nichts aufdecken: Ein falsch hinterlegtes SPARKLE_PRIVATE_KEY
          # bestand Signieren und Prüfen, obwohl die Apps einen anderen
          # SUPublicEDKey tragen und jedes Update ablehnen würden.
          #
          # sign_update kann nur mit dem privaten Schlüssel verifizieren
          # (`--verify` nimmt keinen öffentlichen), deshalb übernimmt das
          # CryptoKit. Sparkle hängt den Signaturblock ans Dateiende und nennt
          # darin die Zahl der signierten Bytes ("length") — das ist genau der
          # Feed vor dem Anhängen.
          #
          # Argumente: <appcast.xml> <erwarteter SUPublicEDKey>
          favenio_check_feed() {
            local feed="$1" public_key="$2"
            local block signature length size work
            block=$(awk '/^<!-- sparkle-signatures:/ { found = 1 } found' \
              "$feed")
            signature=$(printf '%s\n' "$block" | sed -n 's/^edSignature: *//p')
            length=$(printf '%s\n' "$block" | sed -n 's/^length: *//p')
            if [[ -z "$signature" || -z "$length" ]]; then
              echo "ERROR: $feed carries no embedded Sparkle signature." >&2
              return 1
            fi
            if [[ ! "$length" =~ ^[0-9]+$ ]]; then
              echo "ERROR: $feed declares a non-numeric signed length." >&2
              return 1
            fi
            size=$(wc -c < "$feed" | tr -d ' ')
            if (( length < 1 || length >= size )); then
              echo "ERROR: signed length $length does not fit $feed" \
                "($size bytes)." >&2
              return 1
            fi

            work="$(mktemp -d)"
            head -c "$length" "$feed" > "$work/signed-part.xml"
            # Der signierte Teil muss der Feed selbst sein, nicht bloß ein
            # Anfangsstück davon.
            if ! xmllint --noout "$work/signed-part.xml"; then
              echo "ERROR: the signed part of $feed is not the feed." >&2
              return 1
            fi
          cat > "$work/verify-ed25519.swift" <<'SWIFT'
          import CryptoKit
          import Foundation

          // Prüft eine Ed25519-Signatur (base64) über den Inhalt einer Datei
          // gegen einen öffentlichen Schlüssel (base64, 32 Byte roh) — genau
          // die Prüfung, die Sparkle im Client mit SUPublicEDKey macht.
          // Aufruf: swift verify-ed25519.swift <pubkey> <signatur> <datei>
          let arguments = CommandLine.arguments
          guard arguments.count == 4,
                let keyData = Data(base64Encoded: arguments[1]),
                let signature = Data(base64Encoded: arguments[2]),
                let message = FileManager.default.contents(atPath: arguments[3]),
                let key = try? Curve25519.Signing.PublicKey(
                  rawRepresentation: keyData)
          else {
            FileHandle.standardError.write(
              Data("ERROR: bad arguments for the signature check\n".utf8))
            exit(2)
          }
          if key.isValidSignature(signature, for: message) {
            print("Feed signature verified against SUPublicEDKey.")
            exit(0)
          }
          FileHandle.standardError.write(
            Data("ERROR: feed signature does not match SUPublicEDKey\n".utf8))
          exit(1)
          SWIFT
            swift "$work/verify-ed25519.swift" "$public_key" "$signature" \
              "$work/signed-part.xml"
          }
          # ===== END favenio-check-feed =====

          favenio_check_feed site/appcast.xml "$ARTIFACT_PUBLIC_KEY"
          xmllint --noout site/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
