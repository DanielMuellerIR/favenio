# macOS prüft beide Python-Interpreter und die Bundles. Linux baut den
# GTK-Frontend-Code und prüft die Swift-Sprachgrenze im Build-Container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python- und Swift-Code prüfen
        run: |
          python3 -m venv "$RUNNER_TEMP/favenio-lint"
          "$RUNNER_TEMP/favenio-lint/bin/python" -m pip install ruff==0.15.9
          "$RUNNER_TEMP/favenio-lint/bin/ruff" check favenio.py tools tests linux linux/helpers/favenio-document
          xcrun swift-format lint --strict ocr/DocumentHelperIO.swift ocr/VisionText.swift ocr/main.swift pdf/main.swift

      - name: Zsh-Einstiegsskripte prüfen
        run: |
          for script in build.sh build-app.sh install.sh notarize-lib.sh release.sh; do
            zsh -n "$script"
          done

      - name: Unit-Tests (System-Python /usr/bin/python3)
        run: /usr/bin/python3 -m unittest discover -s tests

      - name: Unit-Tests (PATH-python3)
        run: python3 -m unittest discover -s tests

      - name: Apps bauen + Headless-Selbsttest
        env:
          # CI prüft bewusst den zertifikatslosen Fallback. Ein zufällig im
          # Runner vorhandenes Zertifikat darf diesen Pfad nicht verdecken.
          FAVENIO_SIGN_ID: "-"
        run: ./build-app.sh

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bash-Einstiegsskripte prüfen
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
            shellcheck --severity=error "$script"
          done < <(git ls-files -z 'linux/*.sh')

      - name: Linux bauen und Swift-Sprachgrenze prüfen
        run: linux/build-container.sh check
